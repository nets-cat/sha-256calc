<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHA-256 Hash</title>

<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
}

.footer {
    position: fixed;
    left: 0;
    bottom: 0;
    width: 100%;
    background-image: linear-gradient(to right, red, darkblue);
    color: white;
    text-align: right;
}

.custom-file-upload,
.btn {
    border: 1px solid #ccc;
    display: inline-block;
    padding: 6px 12px;
    cursor: pointer;
    background: white;
}

.icon {
    position: relative;
    bottom: 10px;
    left: 2px;
}

textarea {
    resize: vertical;
}
</style>
</head>

<body>

<h1>SHA-256 Hash</h1>

<label for="myfile" class="custom-file-upload">
    Choose File
</label>

<input
    type="file"
    id="myfile"
    name="upload_cont_img"
    onchange="onMyfileChange(this)"
    style="display:none;"
/>

<label id="file-name"></label>

<div>
    <p>
        <textarea
            id="sha"
            rows="2"
            cols="80"
            placeholder="Enter expected SHA-256 hash..."
            autofocus
        ></textarea>

        <span id="verified" class="icon" hidden>✅</span>
    </p>

    <div>
        <input
            type="button"
            value="Verify"
            onclick="verifyHash()"
            class="btn"
        >

        <button type="button" id="reset" class="btn">
            Reset
        </button>

        <p>
            <span
                id="note"
                hidden
                style="background-color:red;color:white;font-weight:bold"
            >
                SHA-256 does not match.
            </span>
        </p>

        <p>
            <textarea
                id="resultsha"
                rows="2"
                cols="80"
                readonly
                placeholder="Generated SHA-256 hash..."
            ></textarea>
        </p>
    </div>
</div>

<script>
async function onMyfileChange(fileInput) {
    const file = fileInput.files[0];

    if (!file) {
        return;
    }

    // Reset previous results
    document.getElementById("note").hidden = true;
    document.getElementById("verified").hidden = true;
    document.getElementById("sha").style.borderColor = "";
    document.getElementById("resultsha").value = "";

    document.getElementById("file-name").textContent = file.name;

    try {
        const buffer = await file.arrayBuffer();

        const hashBuffer = await crypto.subtle.digest(
            "SHA-256",
            buffer
        );

        const hashHex = [...new Uint8Array(hashBuffer)]
            .map(b => b.toString(16).padStart(2, "0"))
            .join("");

        document.getElementById("resultsha").value = hashHex;
    }
    catch (error) {
        console.error("Hash generation failed:", error);
        alert("Failed to calculate SHA-256 hash.");
    }
}

function verifyHash() {
    const expectedHash = document
        .getElementById("sha")
        .value
        .trim()
        .toLowerCase();

    const calculatedHash = document
        .getElementById("resultsha")
        .value
        .trim()
        .toLowerCase();

    const input = document.getElementById("sha");
    const note = document.getElementById("note");
    const verified = document.getElementById("verified");

    if (!calculatedHash) {
        alert("Please select a file first.");
        return;
    }

    if (!/^[a-f0-9]{64}$/i.test(expectedHash)) {
        alert("Please enter a valid SHA-256 hash.");
        return;
    }

    if (expectedHash === calculatedHash) {
        input.style.borderColor = "#1eba1e";
        note.hidden = true;
        verified.hidden = false;
    } else {
        input.style.borderColor = "red";
        note.hidden = false;
        verified.hidden = true;
    }
}

document.getElementById("reset").addEventListener("click", () => {
    location.reload();
});
</script>

<div class="footer">
    <p><em>SHA-256 Calculator</em>&nbsp;</p>
</div>

</body>
</html>
